[project]
name = "homesiem-backend"
version = "0.1.0"
description = "Backend ya HomeSIEM: auth kupitia Firebase, data kwenye Postgres."
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "alembic/versions"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "B",    # bugbear
    "UP",   # pyupgrade
    "SIM",  # simplify
    "RUF",
]
ignore = [
    "B008",   # Depends() kwenye default ni mtindo wa FastAPI
    "RUF001", # maandishi ya Kiswahili yana herufi ambazo ruff inaziona za ajabu
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
exclude = "(\\.venv|alembic/versions)"

[[tool.mypy.overrides]]
module = ["firebase_admin.*", "tests.*"]
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
